processes:

  # ── GWS / ADK Agent (Gemini + Google Workspace) ───────────────────────────
  # Gemini-based agent managing Gmail and Drive via the gws CLI.
  # Runs as a script; adjust the path and prompts to match your ADK setup.

  - name: gws-email
    type: script
    enabled: true
    path: ~/Projects/gws-agent/run.sh
    args: [--task, email]
    env:
      GOOGLE_CLOUD_PROJECT: your-project-id
      GOOGLE_APPLICATION_CREDENTIALS: ~/keys/gws-sa.json

  - name: gws-drive
    type: script
    enabled: false                  # enable once email pass is stable
    path: ~/Projects/gws-agent/run.sh
    args: [--task, drive]
    env:
      GOOGLE_CLOUD_PROJECT: your-project-id
      GOOGLE_APPLICATION_CREDENTIALS: ~/keys/gws-sa.json

  # ── Dropbox Organizer (Claude Code + custom MCP) ──────────────────────────
  # Runs a time-boxed Claude session in your Dropbox plugin directory.
  # Phase 1: audit-only (read, produce manifest — no writes).
  # Phase 2: enable write mode once manifest is reviewed.

  - name: dropbox-audit
    type: claude
    enabled: true
    dir: ~/Projects/dropbox-organizer
    flags: [-p]
    prompt: |
      Run a read-only audit pass on Dropbox. Do NOT move or delete anything.
      Produce a manifest of files that should be reorganized, grouped by
      suggested destination folder. Prioritize: /Photos, /Documents/Archive,
      /Projects (active vs inactive). Write the manifest to audit-output.md
      in the current directory. Stop after 30 minutes.

  - name: dropbox-organize
    type: claude
    enabled: false                  # enable only after reviewing audit-output.md
    dir: ~/Projects/dropbox-organizer
    flags: [-p]
    prompt: |
      Organize Dropbox according to the manifest in audit-output.md and
      the organization principles in your skills. Work folder-by-folder.
      Log every move and delete to the audit trail with source, destination,
      and reason. Stop after 45 minutes. Do not delete anything not in
      the manifest without pausing to confirm.

  # ── Bookmark Knowledge Base ────────────────────────────────────────────────
  # Parses a browser bookmark export, fetches page metadata, enriches with
  # Claude Haiku, and upserts into Pinecone via Voyage-3 embeddings.
  # Requires a Pinecone index named "bookmarks" (dimension=1024, metric=cosine).
  #
  # Bootstrap: run bookmark-ingest once manually to seed the index.
  # Ongoing:   enable bookmark-sync to process newly added bookmarks daily.

  - name: bookmark-ingest
    type: script
    enabled: false                  # run once manually: python bookmarks/ingest.py --input ~/bookmarks.html
    path: bookmarks/ingest.py       # relative to repo root
    args: [--input, ~/bookmarks-export.html]
    env:
      ANTHROPIC_API_KEY: ""
      PINECONE_API_KEY: ""
      VOYAGE_API_KEY: ""

  - name: bookmark-sync
    type: script
    enabled: false                  # enable for daily incremental sync
    path: bookmarks/ingest.py
    args: [--input, ~/bookmarks-export.html, --since, yesterday]
    env:
      ANTHROPIC_API_KEY: ""
      PINECONE_API_KEY: ""
      VOYAGE_API_KEY: ""

  # ── Example: local dev server ─────────────────────────────────────────────

  - name: my-app
    type: server
    enabled: false
    dir: ~/Projects/my-app
    command: npm start
    env:
      NODE_ENV: development
      PORT: "3000"
